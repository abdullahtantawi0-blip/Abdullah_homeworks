<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>First step:items side by side</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1 class="logo">Coderz</h1>
      <nav>
        <a href="#">الرئيسية</a>
        <a href="#">اللقاءات</a>
        <a href="#">تواصل هنا</a>
      </nav>
    </header>
    <div class="container">
      <div class="hero">
        <h2>لقاءات هذا الأسبوع</h2>
        <p>تعلم، جرّب، وشارك تطبيقك</p>
      </div>

      <div class="cards">
        <div class="card">
          <span class="tag">للمبتدئين</span>
          <h3>HTML</h3>
          <p>ابنِ محتوى الصفحة</p>
          <button>تفاصيل اللقاء</button>
        </div>

        <div class="card">
          <span class="tag">تطبيق عملي</span>
          <h3>CSS</h3>
          <p>نسّق الألوان والمسافات</p>
          <button>تفاصيل اللقاء</button>
        </div>

        <div class="card">
          <span class="tag">مراجعة</span>
          <h3>Git</h3>
          <p>احفظ تغييرات مشروعك</p>
          <button>تفاصيل اللقاء</button>
        </div>
      </div>
    </div>
  </body>
</html>
